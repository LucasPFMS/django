<!DOCTYPE html>
<html lang="en">
<head>

    <title>All</title>
</head>
<body>
<ul>
    {% for question in question_list %}

        <a href="{% url 'polls:detail' question.id %}">

        </a>
    </li>
    {% endfor %}
</ul>

</body>
</html>
